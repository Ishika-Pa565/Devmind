version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: devmind
      POSTGRES_PASSWORD: devmind123
      POSTGRES_DB: devmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma

volumes:
  pgdata:
  chromadata: